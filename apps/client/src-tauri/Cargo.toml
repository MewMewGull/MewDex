[package]
name = "mewdex-client"
version = "0.1.11-preview.20261108"
license = "Apache-2.0"
repository = "https://github.com/MewMewGull/MewDex"
description = "MewDex app with composable terminals and Hub Controller"
edition = "2021"
default-run = "mewdex-client"

[features]
notification-risk = []

[[bin]]
name = "mewdex-notification-risk"
path = "src/bin/notification_risk.rs"
required-features = ["notification-risk"]

[lib]
name = "mewdex_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
semver = "=1.0.28"
sha2 = "=0.10.9"
quick-xml = "=0.42.0"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
keyring-core = "=1.0.1"
tauri-plugin-opener = "2"
tauri-plugin-notification = "=2.8.0"

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
windows-native-keyring-store = "1"
winreg = "=0.56.0"
tauri-plugin-single-instance = "=2.5.1"
tauri-plugin-window-state = "=2.5.0"
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "=2.8.3"
getrandom = "=0.3.4"
url = "=2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.1"
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["protected"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }

[patch.crates-io]
tauri-plugin-notification = { path = "../../../third_party/tauri-plugin-notification" }
