name: MewDexInputRisk
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MewDexInputUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: MewDexInputUITests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mewdex.development.input-uitests
        TEST_TARGET_NAME: ""
schemes:
  MewDexInputRisk:
    build:
      targets:
        MewDexInputUITests: [test]
    test:
      targets:
        - MewDexInputUITests
      gatherCoverageData: false
      captureScreenshotsAutomatically: false
